<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1350" viewBox="0 0 1200 1350" role="img" aria-labelledby="title desc">
  <title id="title">Les 23 joueurs du Kosovo convoqués en juin 2027</title>
  <desc id="desc">Publication de la Fédération de Football du Kosovo datée du 4 juin 2027.</desc>
  <defs>
