<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Les 24 qualifiés pour l’Euro 2028</title><desc id="desc">Présentation des nations qualifiées directement, via le classement des deuxièmes, les barrages et le repêchage du pays de Galles.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081d43"/><stop offset="1" stop-color="#020815"/></linearGradient><radialGradient id="glow" cx="85%" cy="10%" r="80%"><stop stop-color="#245fc7" stop-opacity=".5"/><stop offset="1" stop-color="#245fc7" stop-opacity="0"/></radialGradient></defs>
  <rect width="1200" height="675" fill="url(#bg)"/><rect width="1200" height="675" fill="url(#glow)"/><path d="M80 124H1120" stroke="#efbd52" stroke-width="3"/><g font-family="Arial,Helvetica,sans-serif"><text x="80" y="65" fill="#9db1cb" font-size="23">CHAMPIONNAT D’EUROPE · ROYAUME-UNI</text><text x="80" y="110" fill="#fff" font-size="42" font-weight="800">EURO 2028 : LES 24 QUALIFIÉS</text>
  <g transform="translate(80 165)"><rect width="1040" height="150" rx="22" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="28" y="38" fill="#efbd52" font-size="23" font-weight="800">12 VAINQUEURS DE GROUPE</text><text x="28" y="80" fill="#fff" font-size="22">Espagne · France · Angleterre · Portugal · Italie · Serbie</text><text x="28" y="118" fill="#fff" font-size="22">Grèce · Suisse · Suède · Kosovo · Écosse · Ukraine</text></g>
  <g transform="translate(80 335)"><rect width="1040" height="112" rx="22" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="28" y="36" fill="#5ba7ff" font-size="23" font-weight="800">8 MEILLEURS DEUXIÈMES</text><text x="28" y="79" fill="#fff" font-size="22">Turquie · Irlande · Allemagne · Croatie · Hongrie · Rép. tchèque · Danemark · Pays-Bas</text></g>
  <g transform="translate(80 467)"><rect width="675" height="105" rx="22" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/><text x="28" y="36" fill="#71d7aa" font-size="23" font-weight="800">3 VAINQUEURS DES BARRAGES</text><text x="28" y="77" fill="#fff" font-size="23">Norvège · Macédoine du Nord · Bosnie</text></g>
  <g transform="translate(775 467)"><rect width="345" height="105" rx="22" fill="#efbd52" fill-opacity=".12" stroke="#efbd52" stroke-opacity=".7"/><text x="24" y="36" fill="#efbd52" font-size="21" font-weight="800">PAYS HÔTE REPÊCHÉ</text><text x="24" y="77" fill="#fff" font-size="27" font-weight="800">Pays de Galles</text></g>
  <text x="80" y="630" fill="#5ba7ff" font-size="23" font-weight="700">#EURO2028  #Kosovo  #Dardanët</text><text x="1120" y="630" text-anchor="end" fill="#aab8cd" font-size="21">29 mars 2028</text></g>
